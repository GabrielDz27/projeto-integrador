spring.application.name=scm
spring.config.import=optional:file:.env[.properties]

# Conexao Banco de Dados
spring.datasource.url=${PSQLDB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${PSQLDB_USERNAME:postgres}
spring.datasource.password=${PSQLDB_PASSWORD:postgres}
server.port=${SERVER_PORT:8081}

# Seguranca / JWT
jwt_secret=${JWT_SECRET:minha-chave-secreta-dev}
jwt.expiration=3600000

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.web.error.include-stacktrace=never

# Bancos locais criados antes do Flyway recebem baseline 0 e seguem as migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Email
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
