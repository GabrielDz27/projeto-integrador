version: "3.9"

services:
  spring_db:
    container_name: spring_db
    image: postgres:12
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${PSQLDB_PASSWORD}
      POSTGRES_USER: ${PSQLDB_USERNAME}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PSQLDB_USERNAME} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: scm_api
    depends_on:
      spring_db:
        condition: service_healthy
    environment:
      PSQLDB_URL: jdbc:postgresql://spring_db:5432/postgres
      PSQLDB_USERNAME: ${PSQLDB_USERNAME}
      PSQLDB_PASSWORD: ${PSQLDB_PASSWORD}
      SERVER_PORT: 8081
    ports:
      - "8081:8081"

volumes:
  pgdata: {}