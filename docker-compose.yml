services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scm
      POSTGRES_USER: scm
      POSTGRES_PASSWORD: scm_dev
    ports:
      - "5432:5432"
    volumes:
      - scm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scm -d scm"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api/scm
      dockerfile: Dockerfile
    environment:
      PSQLDB_URL: jdbc:postgresql://db:5432/scm
      PSQLDB_USERNAME: scm
      PSQLDB_PASSWORD: scm_dev
      SERVER_PORT: 8081
      JWT_SECRET: desenvolvimento-local-substituir
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  front:
    build:
      context: ./front/scm
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

  seed:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      PGPASSWORD: scm_dev
    volumes:
      - ./api/scm/scripts/seed_dados_teste.sql:/seed.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until psql -h db -U scm -d scm -tAc 'SELECT count(*) FROM flyway_schema_history WHERE version::integer = 5 AND success' 2>/dev/null | grep -q '^1$'; do sleep 2; done;
        psql -h db -U scm -d scm -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

volumes:
  scm_postgres:

