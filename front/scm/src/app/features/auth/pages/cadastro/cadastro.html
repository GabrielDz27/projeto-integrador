<app-layout-auth
  titulo="Crie seu acesso ao SCM"
  subtitulo="Cadastre seu usuário para acompanhar clientes, faturamento e obrigações fiscais."
  badge="SCM | GESTÃO MEI">
  <div class="register-card">
    <div class="register-heading">
      <p class="eyebrow">Novo acesso</p>
      <h2>Criar conta</h2>
      <p>Preencha seus dados para começar a usar o Sistema de Gestão Simplificada.</p>
    </div>
    <app-usuario-form [submitting]="isSubmitting()" (submitForm)="onSubmit($event)"></app-usuario-form>
  </div>
</app-layout-auth>
