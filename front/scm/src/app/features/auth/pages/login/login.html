<app-layout-auth>
  <div class="w-full max-w-xl rounded-2xl border border-black/15 bg-white/10 p-10 backdrop-blur-sm">
    <div>
      <h2 class="text-3xl font-semibold text-slate-900">Entrar</h2>
      <p class="mt-1 text-slate-600">Acesse sua conta para continuar.</p>
    </div>

    <form class="mt-5 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label class="block text-sm font-semibold text-slate-900">Login</label>
        <input
          type="text"
          formControlName="login"
          autocomplete="username"
          placeholder="Username"
          [class.input-invalid]="form.controls.login.touched && form.controls.login.invalid"
          class="mt-2 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-base text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-600"
        />
        @if (form.controls.login.touched && form.controls.login.invalid) {
          <p class="mt-2 text-sm text-red-600">Informe seu login.</p>
        }
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label class="block text-sm font-semibold text-slate-900">Senha</label>
          <!--<a href="/recuperar-senha" class="text-sm font-semibold text-sky-700 hover:text-sky-600">
            Esqueci a senha
          </a>-->
        </div>

        <input
          type="password"
          formControlName="senha"
          autocomplete="current-password"
          placeholder="••••••••"
          [class.input-invalid]="form.controls.senha.touched && form.controls.senha.invalid"
          class="mt-2 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-base text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-600"
        />

        @if (form.controls.senha.touched && form.controls.senha.invalid) {
          <p class="mt-2 text-sm text-red-600">Informe sua senha.</p>
        }
      </div>

      @if (formError()) {
        <div class="rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
          {{ formError() }}
        </div>
      }

      <button class="login-submit" type="submit" [disabled]="isSubmitting() || form.invalid">
        {{ isSubmitting() ? 'Entrando...' : 'Entrar' }}
      </button>

      <p class="mt-3 text-sm text-slate-600 text-center">
        Ainda não possui conta?
        <a routerLink="/cadastro" class="cursor-pointer font-semibold text-sky-700 hover:text-sky-600">
          Criar agora
        </a>
      </p>
    </form>
  </div>
</app-layout-auth>
