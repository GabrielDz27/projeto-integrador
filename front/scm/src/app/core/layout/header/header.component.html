<header class="app-header">
  <a class="brand" routerLink="/inicio" aria-label="SCM - início">SCM <span>Gestão simplificada para MEI</span></a>

  <div class="user-area">
    <button type="button" class="user-trigger" (click)="toggleUserMenu()" [attr.aria-expanded]="userMenuOpen()">
      @if (session.perfil()?.avatarUrl && !avatarFailed()) {
        <img class="user-avatar" [src]="session.perfil()?.avatarUrl" [alt]="'Foto de ' + session.userName()" (error)="onAvatarError()" />
      } @else {
        <span class="user-avatar">{{ session.userInitials() }}</span>
      }
      <span class="user-name">{{ session.userName() }}</span>
      <span aria-hidden="true">⌄</span>
    </button>

    @if (userMenuOpen()) {
      <div class="user-menu">
        <div class="user-menu-profile">
          @if (session.perfil()?.avatarUrl && !avatarFailed()) {
            <img class="user-avatar" [src]="session.perfil()?.avatarUrl" [alt]="'Foto de ' + session.userName()" (error)="onAvatarError()" />
          } @else {
            <span class="user-avatar">{{ session.userInitials() }}</span>
          }
          <span>{{ session.userName() }}</span>
        </div>
        <a routerLink="/minha-conta" (click)="closeUserMenu()">Minha conta</a>
        <button type="button" (click)="onLogout()">Sair</button>
      </div>
    }
  </div>
</header>
