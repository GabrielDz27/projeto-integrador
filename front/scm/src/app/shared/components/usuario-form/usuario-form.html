@if (apiError()) {
<div class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
  {{ apiError() }}
</div>
}

<form class="mt-5 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
  <!-- Avatar -->
  <div class="flex items-start gap-4">
    <div class="h-16 w-16 rounded-full bg-slate-100 overflow-hidden grid place-items-center">
      @if (avatarPreviewUrl()) {
      <img [src]="avatarPreviewUrl()!" class="h-full w-full object-cover" />
      } @else {
      <span class="text-slate-500 font-bold">👤</span>
      }
    </div>

    <div class="flex-1">
      <label class="block text-sm font-semibold text-slate-900">Foto do usuário <span class="font-normal text-slate-500">(opcional)</span></label>

      <div class="mt-2 flex flex-col gap-2 sm:flex-row sm:items-center sm:gap-3">
        <input type="file" accept="image/*" (change)="onAvatarPicked($event)"
          class="block w-full text-sm text-slate-700 file:mr-4 file:rounded-xl file:border-0 file:bg-slate-100 file:px-4 file:py-2 file:font-semibold file:text-slate-700 hover:file:bg-slate-200" />

        @if (avatarPreviewUrl()) {
        <button type="button" (click)="clearAvatar()"
          class="rounded-xl border border-slate-300 px-4 py-2 font-semibold text-slate-700 hover:bg-slate-100">
          Remover
        </button>
        }
      </div>

      @if (avatarUploading()) {
      <p class="mt-2 text-xs text-slate-500">Enviando imagem...</p>
      }

      @if (avatarError()) {
      <p class="mt-2 text-sm text-red-600">{{ avatarError() }}</p>
      }
    </div>
  </div>

  <!-- Nome -->
  <div>
    <label class="block text-sm font-semibold text-slate-900">Nome</label>
    <input type="text" formControlName="nome" placeholder="Seu nome completo"
      [class.input-invalid]="form.controls.nome.touched && form.controls.nome.invalid"
      class="mt-2 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-base text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-600" />
  </div>

  <!-- Email -->
  <div>
    <label class="block text-sm font-semibold text-slate-900">Email</label>
    <input type="email" formControlName="email" placeholder="seuemail@exemplo.com"
      [class.input-invalid]="form.controls.email.touched && form.controls.email.invalid"
      class="mt-2 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-base text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-600" />
  </div>

  <!-- Telefone / CEP -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-semibold text-slate-900">Telefone</label>
      <input type="tel" formControlName="telefone" appNumericMask="telefone" inputmode="numeric" maxlength="15" placeholder="(00) 00000-0000"
        [class.input-invalid]="form.controls.telefone.touched && form.controls.telefone.invalid"
        class="mt-2 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-base text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-600" />
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-900">CEP</label>
      <input type="text" formControlName="cep" appNumericMask="cep" inputmode="numeric" maxlength="9" placeholder="00000-000"
        [class.input-invalid]="form.controls.cep.touched && form.controls.cep.invalid"
        class="mt-2 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-base text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-600" />
    </div>
  </div>

  <!-- Estado / Cidade -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-semibold text-slate-900">Estado</label>
      <select formControlName="estado"
        [class.input-invalid]="form.controls.estado.touched && form.controls.estado.invalid"
        class="mt-2 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-base text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-600">
        <option value="">Selecione o estado</option>
        @for (estado of estados; track estado.uf) {
        <option [value]="estado.uf">{{ estado.nome }}</option>
        }
      </select>
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-900">Cidade</label>
      <input type="text" formControlName="cidade" placeholder="Sua cidade"
        [class.input-invalid]="form.controls.cidade.touched && form.controls.cidade.invalid"
        class="mt-2 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-base text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-600" />
    </div>
  </div>

  <!-- Username -->
  <div>
    <label class="block text-sm font-semibold text-slate-900">Usuário de acesso</label>
    <input type="text" formControlName="username" placeholder="Escolha um usuário para entrar no SCM"
      [class.input-invalid]="form.controls.username.touched && form.controls.username.invalid"
      class="mt-2 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-base text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-600" />
  </div>

  <!-- Senha -->
  <div>
    <div class="flex items-center justify-between">
      <label class="block text-sm font-semibold text-slate-900">
        Senha
        @if (modo === 'editar') {
        <span class="text-xs font-normal text-slate-500">(opcional)</span>
        }
      </label>
    </div>

    <input type="password" formControlName="senha" autocomplete="new-password" placeholder="Mínimo de 6 caracteres"
      [class.input-invalid]="form.controls.senha.touched && form.controls.senha.invalid"
      class="mt-2 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-base text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-600" />

    @if (modo === 'editar') {
    <p class="mt-2 text-xs text-slate-500">
      Deixe em branco se não quiser alterar sua senha.
    </p>
    }
  </div>

  <button type="submit" [disabled]="submitting || avatarUploading() || form.invalid"
    class="w-full rounded-xl bg-sky-600 px-4 py-3 font-semibold text-white hover:bg-sky-700 disabled:cursor-not-allowed disabled:opacity-60">
    @if (modo === 'cadastrar') {
    {{ submitting ? 'Criando...' : 'Criar conta' }}
    } @else {
    {{ submitting ? 'Salvando...' : 'Salvar alterações' }}
    }
  </button>
</form>
