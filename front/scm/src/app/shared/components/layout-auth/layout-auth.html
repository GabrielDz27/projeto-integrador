<div class="min-h-screen bg-white">
  <div class="grid min-h-screen lg:grid-cols-2">
    <!-- LADO ESQUERDO -->
    <section class="relative overflow-hidden bg-sky-800 text-white">
      <div class="absolute inset-0 opacity-20">
        <div class="absolute -top-28 -left-28 h-80 w-80 rounded-full bg-white"></div>
        <div class="absolute -bottom-32 -right-32 h-[28rem] w-[28rem] rounded-full bg-white"></div>
      </div>

      <div class="relative h-full px-8 py-14 sm:px-12 lg:px-14 flex items-center justify-center text-center">
        <div class="max-w-4xl">
          <div class="mx-auto inline-flex items-center gap-2 rounded-full bg-white/10 px-5 py-2 text-xl font-semibold">
            {{ badge() }}
          </div>

          <h1 class="mt-6 text-4xl sm:text-5xl lg:text-6xl font-semibold tracking-tight text-balance">
            {{ titulo() }}
          </h1>

          <p class="mt-5 text-base sm:text-lg text-white/85">
            {{ subtitulo() }}
          </p>

          <div class="mt-10 mx-auto max-w-xl text-left">
            <ul class="space-y-3 text-lg sm:text-lg text-white/90">
              @for (b of beneficios(); track b) {
                <li class="flex items-start gap-3">
                  <span class="mt-2 inline-block h-2 w-2 rounded-full bg-white"></span>
                  <span>{{ b }}</span>
                </li>
              }
            </ul>
          </div>
        </div>
      </div>
    </section>

    <!-- LADO DIREITO -->
    <section class="flex items-center justify-center px-6 py-14 sm:px-10">
      <ng-content />
    </section>
  </div>
</div>
