@if (open) {
<div class="modal-backdrop" (click)="close()">
  <section class="modal-dialog" role="dialog" aria-modal="true" [attr.aria-label]="title" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <div>
        <h2>{{ title }}</h2>
        @if (description) { <p>{{ description }}</p> }
      </div>
      <button type="button" class="modal-close" (click)="close()" aria-label="Fechar">×</button>
    </header>
    <div class="modal-body"><ng-content></ng-content></div>
    @if (showFooter) {
      <footer class="modal-footer">
        <button class="modal-secondary" type="button" (click)="onSecondary()">
          {{ secondaryLabel }}
        </button>
        <button class="modal-primary" type="button" [disabled]="primaryDisabled" (click)="onPrimary()">
          {{ primaryLabel }}
        </button>
      </footer>
    }
  </section>
</div>
}
