@if (open) {
<div class="fixed inset-0 z-99">
  <!-- overlay -->
  <div class="absolute inset-0 bg-black/40" (click)="close()"></div>

  <!-- modal -->
  <div class="relative mx-auto flex min-h-full w-full items-end justify-center p-4 sm:items-center">
    <div class="w-full max-w-2xl rounded-2xl bg-white shadow-xl ring-1 ring-black/5">
      <!-- header -->
      <div class="flex items-start justify-between gap-4 border-b border-slate-200 px-6 py-4">
        <div class="min-w-0">
          <h2 class="text-lg font-bold text-slate-900">{{ title }}</h2>
          @if (description) {
          <p class="mt-1 text-sm text-slate-600">{{ description }}</p>
          }
        </div>

        <button type="button" (click)="close()"
          class="inline-flex h-9 w-9 items-center justify-center rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-700"
          aria-label="Fechar">
          ✕
        </button>
      </div>

      <!-- body -->
      <div class="px-6 py-5">
        <ng-content></ng-content>
      </div>

      <!-- footer -->
      @if (showFooter) {
      <div class="flex flex-col-reverse gap-3 border-t border-slate-200 px-6 py-4 sm:flex-row sm:justify-end">
        <app-button variant="outline" type="button" (click)="onSecondary()">
          {{ secondaryLabel }}
        </app-button>

        <app-button variant="primary" type="button" [disabled]="primaryDisabled" (click)="onPrimary()">
          {{ primaryLabel }}
        </app-button>
      </div>
      }
    </div>
  </div>
</div>
}
